<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskbee Helper</title>
    <script src="../lib/theme.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div id="update-banner" class="update-banner" role="status" hidden>
      <div class="update-text">
        <strong id="update-title"></strong>
        <small data-i18n="update_how"></small>
      </div>
      <a id="update-download" class="update-link" target="_blank" rel="noopener" data-i18n="update_download"></a>
      <button type="button" id="update-dismiss" class="icon-btn" data-i18n-label="update_dismiss">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="list" data-i18n="tab_list">My Reserves</button>
      <button class="tab-btn" data-tab="new" data-i18n="tab_new">New Booking</button>
    </div>

    <main class="panes">
      <!-- ============ MY RESERVES ============ -->
      <div id="list-tab" class="tab-content">
        <h2 class="pane-title" data-i18n="pane_list">My reserves</h2>
        <div class="toolbar">
          <label class="check-all">
            <input type="checkbox" id="select-all" /> <span data-i18n="all">All</span>
          </label>
          <button type="button" id="toggle-filter" class="ghost" data-i18n="filter">Filter…</button>
          <button type="button" id="edit-selected" class="ghost" disabled></button>
          <button type="button" id="cancel-selected" class="danger" disabled></button>
        </div>

        <div id="filter-panel" class="panel" hidden>
          <div class="form-row">
            <div class="form-group">
              <label for="filter-start" data-i18n="from">From</label>
              <input type="date" id="filter-start" />
            </div>
            <div class="form-group">
              <label for="filter-end" data-i18n="to">To</label>
              <input type="date" id="filter-end" />
            </div>
            <div class="form-group narrow">
              <label for="filter-desk" data-i18n="desk">Desk</label>
              <input type="text" id="filter-desk" data-i18n-placeholder="any" />
            </div>
          </div>
          <div class="weekday-picker" data-name="filter-weekday"></div>
          <button type="button" id="apply-filter" class="ghost full" data-i18n="select_matching">
            Select matching
          </button>
        </div>

        <div id="reserves">
          <div class="loading" data-i18n="loading">Loading…</div>
        </div>
        <div id="list-status"></div>
      </div>

      <!-- ============ NEW BOOKING ============ -->
      <div id="new-tab" class="tab-content" style="display: none">
        <h2 class="pane-title" data-i18n="pane_new">New booking</h2>
        <div class="preset-row">
          <select id="preset-select" aria-label="Preset">
            <option value="" data-i18n="no_preset">No preset</option>
          </select>
          <button type="button" id="delete-preset" class="ghost" disabled data-i18n="delete">
            Delete
          </button>
        </div>

        <form id="booking-form">
          <div class="form-row">
            <div class="form-group">
              <label for="desk-number" data-i18n="desk">Desk</label>
              <input type="text" id="desk-number" data-i18n-placeholder="eg_desk" required />
            </div>
            <div class="form-group">
              <label for="secondary-desks" data-i18n="secondary_desks">Secondary desks (optional)</label>
              <input type="text" id="secondary-desks" data-i18n-placeholder="eg_secondary" />
            </div>
          </div>
          <small id="desk-lookup-status"></small>

          <div class="form-row">
            <div class="form-group">
              <label for="start-date" data-i18n="start_date">Start date</label>
              <input type="date" id="start-date" required />
            </div>
            <div class="form-group">
              <label for="end-date" data-i18n="end_date">End date</label>
              <input type="date" id="end-date" required />
            </div>
          </div>

          <div class="form-group">
            <label data-i18n="days_of_week">Days of week</label>
            <div class="weekday-picker" data-name="weekday"></div>
          </div>

          <fieldset class="schedule">
            <legend data-i18n="time">Time</legend>
            <div class="time-row">
              <span class="time-row-label" data-i18n="default">Default</span>
              <input type="time" id="start-time" value="13:00" required data-i18n-label="default_checkin" />
              <span class="time-sep" aria-hidden="true">–</span>
              <input type="time" id="end-time" value="17:00" required data-i18n-label="default_checkout" />
            </div>
            <div id="time-exceptions" class="time-exceptions"></div>
            <button type="button" id="add-exception" class="link-btn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              <span data-i18n="different_time">Different time for a day</span>
            </button>
            <small id="schedule-status" class="schedule-status" role="status"></small>
          </fieldset>

          <div class="options-row">
            <label class="inline-check">
              <input type="checkbox" id="skip-booked" checked /> <span data-i18n="skip_booked">Skip days I already booked</span>
            </label>
          </div>

          <button type="submit" id="preview-booking" data-i18n="preview">Preview</button>

          <div class="preset-row">
            <input type="text" id="preset-name" data-i18n-placeholder="preset_name" />
            <button type="button" id="save-preset" class="ghost" data-i18n="save_preset">Save preset</button>
          </div>
        </form>
        <div id="booking-status"></div>
      </div>
    </main>

    <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <h3 id="dialog-title"></h3>
        <div id="dialog-body"></div>
        <div class="button-row">
          <button type="submit" id="dialog-confirm" value="ok"></button>
          <button type="submit" id="dialog-cancel" class="ghost" value="cancel"></button>
        </div>
      </form>
    </dialog>

    <footer class="status-bar">
      <div id="status-line" class="status-line"></div>
      <div class="lang-switch" role="group" data-i18n-label="language">
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn" data-i18n-label="switch_theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <button type="button" id="detach" class="icon-btn" data-i18n-label="open_window">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4h6v6" />
          <path d="M20 4l-8 8" />
          <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" />
        </svg>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
