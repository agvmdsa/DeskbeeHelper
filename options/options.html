<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskbee Helper Options</title>
    <script src="../lib/theme.js"></script>
    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <header class="page-header">
      <h1 class="header-title" data-i18n="opt_title">Deskbee Helper Settings</h1>
      <div class="header-controls">
      <div class="lang-switch" role="group" data-i18n-label="language">
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn" data-i18n-label="switch_theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      </div>
    </header>

    <div class="settings-container">
      <form id="options-form">
        <div class="section-title first" data-i18n="opt_rules"></div>

        <div class="form-group">
          <label for="maxDaysAhead" data-i18n="opt_max_days"></label>
          <input type="number" id="maxDaysAhead" min="0" max="365" value="30" />
        </div>

        <div class="section-title" data-i18n="opt_updates"></div>

        <div class="update-row">
          <span id="update-versions"></span>
          <button type="button" id="check-updates" class="secondary" data-i18n="opt_check_updates"></button>
        </div>
        <small id="update-status" class="update-status" role="status"></small>

        <details class="advanced">
          <summary class="section-title" data-i18n="opt_advanced"></summary>
          <div class="advanced-body">
            <p class="hint" data-i18n-html="opt_hint"></p>

            <div class="form-group">
              <label for="xAppAccount" data-i18n="opt_account"></label>
              <input type="text" id="xAppAccount" />
            </div>

            <div class="form-group">
              <label for="plantId" data-i18n="opt_floor"></label>
              <input type="text" id="plantId" />
            </div>

            <div class="form-group">
              <label for="xAppVersion" data-i18n="opt_version"></label>
              <input type="text" id="xAppVersion" />
            </div>

            <button type="button" id="reset-options" class="secondary" data-i18n="opt_reset"></button>
          </div>
        </details>

        <button type="submit" id="save-options" data-i18n="opt_save"></button>
        <div id="status-message"></div>
      </form>
    </div>

    <footer>
      <div id="version"></div>
    </footer>

    <script type="module" src="options.js"></script>
  </body>
</html>
